<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>My Interactive Image</title>
</head>
<body>
  <h1>Interactive Image Map Example</h1>

  <!-- Image Map Generated by http://www.image-map.net/ -->
  <img src="testart.png" usemap="#image-map" alt="test art">

  <map name="image-map">
      <area 
        target="_blank" 
        alt="birbs" 
        title="birbs" 
        href="https://en.m.wikipedia.org/wiki/Birds_Aren't_Real" 
        coords="209,303,58" 
        shape="circle">

      <area 
        target="_blank" 
        alt="bitski" 
        title="bitski" 
        href="https://x.com/Bitski_Art" 
        coords="635,534,491,426" 
        shape="rect">
  </map>

</body>
</html>
